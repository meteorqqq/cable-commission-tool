# 认证配置模板。复制为 config.yaml 后填入真实值（config.yaml 已被 .gitignore，不入库）。
#
# 生成密码哈希（streamlit-authenticator 0.4.x）：
#   python -c "import streamlit_authenticator as stauth; print(stauth.Hasher.hash('你的明文密码'))"
# 生成 cookie.key（随机强密钥）：
#   openssl rand -hex 32
credentials:
  usernames:
    admin:
      name: 管理员
      password: "<在此填入 bcrypt 哈希>"
    user1:
      name: 审核员
      password: "<在此填入 bcrypt 哈希>"

cookie:
  expiry_days: 30
  key: "<在此填入随机强密钥，勿用可猜测字符串>"
  name: "cable_auth"
